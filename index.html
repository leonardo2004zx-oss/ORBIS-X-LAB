<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Orbis Historias</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">◉ Orbis <span>Historias</span></div>
    <input id="title" class="title" placeholder="Título de la historia" maxlength="40" />
    <div class="actions">
      <label class="btn">＋ Añadir GIFs<input id="file" type="file" accept="image/gif" multiple hidden /></label>
      <button id="demo" class="btn ghost">Cargar demo</button>
      <button id="play" class="btn primary">▶ Ver historia</button>
      <button id="export" class="btn ghost">⬇ Exportar vídeo</button>
    </div>
  </header>

  <main class="layout">
    <aside class="strip" id="strip" aria-label="Diapositivas"></aside>

    <section class="stage">
      <div class="phone" id="phone">
        <div class="empty" id="empty">
          <p class="big">Arrastra aquí tus GIFs animados</p>
          <p>Cada GIF con movimiento se convierte en una diapositiva de tu historia.<br />Los GIFs estáticos se descartan.</p>
        </div>
        <img id="previewImg" alt="" />
        <canvas id="previewText"></canvas>
      </div>
      <p class="meta" id="meta"></p>
    </section>

    <aside class="panel" id="panel" hidden>
      <h2>Diapositiva <span id="slideNum"></span></h2>
      <label>Texto
        <textarea id="caption" rows="3" placeholder="Escribe algo sobre este momento…"></textarea>
      </label>
      <label>Animación del texto <select id="anim"></select></label>
      <div class="row">
        <label>Posición
          <select id="pos">
            <option value="top">Arriba</option>
            <option value="center">Centro</option>
            <option value="bottom">Abajo</option>
          </select>
        </label>
        <label>Color <input id="color" type="color" /></label>
      </div>
      <label>Tamaño <input id="size" type="range" min="50" max="180" /></label>
      <label class="check"><input id="box" type="checkbox" /> Fondo detrás del texto</label>
      <label>Duración: <b id="durLabel"></b>
        <input id="duration" type="range" min="1000" max="15000" step="100" />
      </label>
      <button id="fitLoop" class="btn ghost small">Ajustar a ciclos completos del GIF</button>
      <div class="row">
        <button id="up" class="btn ghost small">↑ Subir</button>
        <button id="down" class="btn ghost small">↓ Bajar</button>
        <button id="remove" class="btn danger small">Eliminar</button>
      </div>
    </aside>
  </main>

  <!-- Visor a pantalla completa -->
  <div class="viewer" id="viewer" hidden>
    <div class="story">
      <div class="bars" id="bars"></div>
      <div class="story-head"><span class="avatar">◉</span><b id="vTitle"></b><button id="close" class="x" aria-label="Cerrar">✕</button></div>
      <img id="vImg" alt="" />
      <canvas id="vText"></canvas>
      <div class="tap left" id="tapPrev"></div>
      <div class="tap right" id="tapNext"></div>
      <div class="paused" id="paused" hidden>❚❚</div>
    </div>
  </div>

  <div class="progress" id="videoOut" hidden>
    <div class="out">
      <video id="outVideo" controls playsinline loop></video>
      <div class="row">
        <a id="outLink" class="btn primary" download>⬇ Descargar vídeo</a>
        <button id="outClose" class="btn ghost">Cerrar</button>
      </div>
    </div>
  </div>
  <div class="toast" id="toast" hidden></div>
  <div class="progress" id="exporting" hidden><div><p>Grabando vídeo…</p><progress id="exportBar" max="1" value="0"></progress></div></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
